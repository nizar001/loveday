<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffc9de">
<title>Hari I Love You 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
<div id="hearts"></div>
<div class="modal" id="md" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="mcard">
    <button class="mx" id="mx" aria-label="Tutup">✕</button>
    <div class="mph" id="mph"></div>
    <h2 id="mt"></h2>
    <p class="mmsg" id="mm"></p>
    <div class="np"><button id="mpl" aria-label="Putar atau jeda lagu"><span id="mdk">💿</span></button>
      <div class="nt"><b id="mst"></b><small id="msn"></small></div><span class="eq"><i></i><i></i><i></i></span></div>
    <button class="btn" id="mc">Tutup 💕</button>
  </div>
</div>

<!-- Awal: form nama -->
<div class="prog"><i id="pf"></i><b id="pt">💗</b></div>
<section class="screen on" id="s0">
  <div class="card">
    <span class="deco" style="top:-18px;left:-6px">💕</span><span class="deco" style="top:-10px;right:-4px;animation-delay:.8s">💖</span>
    <div class="big">💗</div>
    <h1><br>I Love You</h1>
    <p>Ada kejutan kecil buat kamu, sayang 🥰<br>Tulis nama duluu yaaa...</p>
    <input id="nm" type="text" maxlength="30" placeholder="Nama kamu cantik..." autocomplete="off">
    <div class="err" id="e0"></div>
    <button class="btn" id="go">Buka Kejutan 💌</button>
  </div>
</section>

<!-- Slide 1-4 -->
<section class="screen" id="s1"><div class="card">
  <h1>Halo, <span class="nm"></span> 💖</h1><div class="story" id="t1"></div>
  <div class="dots"></div><div class="nav"><button class="btn" data-n>Lanjut 💕</button></div></div></section>

<section class="screen" id="s2"><div class="card">
  <h1>I Love You Sayang</h1>
  <div class="gallery" id="g2"></div>
  <div class="dots"></div><div class="nav"><button class="btn ghost" data-p>⬅ Balik</button><button class="btn" data-n>Lanjut 💕</button></div></div></section>

<section class="screen" id="s3"><div class="card">
  <h1>Untuk <span class="nm"></span> 💘</h1><div class="story" id="t3"></div>
  <div class="dots"></div><div class="nav"><button class="btn ghost" data-p>⬅ Balik</button><button class="btn" data-n>Lanjut 💕</button></div></div></section>

<section class="screen" id="s4"><div class="card">
  <h1>Selalu Kamu 🌷</h1>
  <div class="gallery" id="g4"></div>
  <div class="dots"></div><div class="nav"><button class="btn ghost" data-p>⬅ Balik</button><button class="btn" id="fin">Selesai 💞</button></div></div></section>

<!-- Form WA -->
<section class="screen" id="s5"><div class="card">
  <div class="big" style="font-size:3.5rem">💌</div>
  <h1>Balas Pesanku, ya?</h1><p>Tulis perasaanmu, nanti terkirim langsung ke WhatsApp-ku 🥹</p>
  <label for="fn">Nama</label><input id="fn" placeholder="Nama kamu">
  <label for="fm">Pesan</label><textarea id="fm" placeholder="Tulis pesan manismu di sini..."></textarea>
  <div class="err" id="e5"></div>
  <button class="wa" id="send"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.2c-.2.6-1.2 1.2-1.7 1.2-.5.1-1 .2-3.3-.7-2.8-1.2-4.6-4-4.7-4.2-.1-.2-1.1-1.4-1.1-2.7s.7-1.9.9-2.2c.2-.2.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.8-.1 1.4z"/></svg>Kirim ke WhatsApp <span class="h">💗</span></button>
  <p class="hint">Kamu bisa kembali melihat kejutan kapan saja 💕</p>
  <button class="btn ghost" id="again">🔁 Lihat dari awal</button>
</div></section>

</div>
<script src="memories.js"></script>
<script src="script.js"></script>
</body>
</html>
